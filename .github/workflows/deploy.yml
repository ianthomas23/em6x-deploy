name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install mamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: build-environment.yml
          cache-environment: true

      - name: Create 32-bit environment
        shell: bash -l {0}
        run: |
          micromamba create -f environment.yml --platform=emscripten-wasm32 -p ./wasm32 --yes

      - name: Create 64-bit environment
        shell: bash -l {0}
        run: |
          micromamba create -f environment.yml --platform=emscripten-wasm64 -p ./wasm64 --yes

      - name: Build the JupyterLite site
        shell: bash -l {0}
        run: |
          jupyter lite build --contents contents --output-dir dist --XeusAddon.prefix=./wasm32 --XeusAddon.prefix=./wasm64 --XeusAddon.default_channels=https://prefix.dev/emscripten-forge-bot/emscripten-forge-6x,https://repo.prefix.dev/conda-forge

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
